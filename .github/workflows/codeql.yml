name: CodeQL

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
      - name: Build
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build libssl-dev
          cmake -S . -B build -G Ninja -DRECON_BUILD_TESTS=OFF
          cmake --build build
      - uses: github/codeql-action/analyze@v3
        with: { category: "/language:c-cpp" }
